# Plan morning-digest § 3 and § 4 (ADR 0003): a static copy of /digest/2026-10-28 on a public
# HTTPS link we can upload over. The page is built here and deployed as a Pages artifact, so the
# preview is never committed. marker=on reads the LANE_MARKER secret; marker=off leaves it unset
# (banner reads "no marker set") and uploads over the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      marker:
        description: 'on = with the lane marker (review), off = without it (clean up)'
        type: choice
        options: ['on', 'off']
        default: 'off'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ inputs.marker == 'on' && secrets.LANE_MARKER || '' }}
          LANE_ID: lane-07
          PORT: 8787
        run: |
          pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8787/health && break; sleep 1; done
          mkdir -p _site
          curl -sf http://localhost:8787/digest/2026-10-28 -o _site/index.html
          grep -c '<tr' _site/index.html
          if [ -z "$LANE_MARKER" ]; then grep -q 'no marker set' _site/index.html; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
